    <path d="M 30 140 Q 100 160 160 135" stroke="#78350f" stroke-width="2" fill="none" opacity="0.5" />
    <ellipse cx="65" cy="65" rx="35" ry="25" transform="rotate(-30 65 65)" fill="url(#specularGlow)" />
